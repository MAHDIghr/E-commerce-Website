name: Django checks and tests

on:
  push:
    branches:
      - developpement-backend
      - developpement
  pull_request:
    branches:
      - developpement-backend
      - developpement

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check --settings=config.settings.development

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.development

      - name: Run test suite
        run: python manage.py test --settings=config.settings.development
