name: Django checks and tests

on:
  workflow_dispatch:
    inputs:
      browser_qa:
        description: Run isolated local browser QA (no Stripe calls)
        type: boolean
        default: false
  push:
    branches:
      - developpement-backend
      - fix/commercial-information
      - developpement
  pull_request:
    branches:
      - developpement-backend
      - developpement

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check --settings=config.settings.development

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.development

      - name: Run test suite
        run: python manage.py test --settings=config.settings.development

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser_qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-browser-only-not-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements.txt
      - name: Install test-only browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run isolated browser journeys
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" python manage.py test qa.browser_runner --settings=config.settings.development
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-browser-evidence
          path: qa-output/
          if-no-files-found: warn
