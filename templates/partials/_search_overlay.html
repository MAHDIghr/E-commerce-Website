<div class="search-overlay" id="search-overlay" aria-hidden="true">
    <div class="search-overlay__panel">
        <form class="search-overlay__form" id="search-form" role="search">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <label for="search-input" class="visually-hidden">Rechercher</label>
            <input type="search" id="search-input" name="q"
                data-i18n-placeholder="search_placeholder"
                placeholder="Rechercher un sac, un accessoire…"
                autocomplete="off">
            <button type="button" class="search-overlay__close" data-action="close-search" aria-label="Fermer la recherche">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="6" y1="18" x2="18" y2="6"></line>
                </svg>
            </button>
        </form>
        <p class="search-overlay__hint" data-i18n="search_hint">La recherche sera bientôt disponible.</p>
    </div>
</div>
